name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Do **not** paste passwords, keyring contents,
        full VPN profiles or your public IP address. Security problems go to
        SECURITY.md, not here.
  - type: input
    id: version
    attributes:
      label: Pervius version
      description: Shown in About, or `dpkg -s pervius | grep Version`.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: distribution
    attributes:
      label: Distribution and version
      description: For example "Ubuntu 26.10" (see `cat /etc/os-release`).
      placeholder: "Ubuntu 26.10"
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options: [x86_64 (amd64), aarch64 (arm64), other]
    validations:
      required: true
  - type: input
    id: desktop
    attributes:
      label: Desktop environment
      placeholder: "GNOME 49"
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Output of `pervius-killswitch diagnose`, and relevant lines from `journalctl --user -b` or `journalctl -u pervius-killswitchd`. Remove usernames, IP addresses and hostnames you do not want to share.
      render: text
