name: Release

# A pushed tag vX.Y.Z builds the packages and publishes a GitHub Release with
# that version's CHANGELOG section as notes. A manual run builds only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build release assets
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lintian gettext appstream
      - name: Check the version
        id: version
        run: |
          version=$(packaging/debian/build.sh --print-version)
          echo "version=$version" >>"$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pervius.__version__ $version"
            exit 1
          fi
      - name: Build the Debian package
        run: packaging/debian/build.sh
      - name: lintian
        run: lintian --cfg packaging/debian/lintianrc --fail-on error dist/pervius_*_all.deb
      - name: Checksums and release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release
          cp "dist/pervius_${VERSION}_all.deb" release/
          (cd release && sha256sum "pervius_${VERSION}_all.deb" >SHA256SUMS && cat SHA256SUMS)
          python3 scripts/changelog.py section "$VERSION" >release/notes.md
          test -s release/notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          cd release
          sha256sum --check SHA256SUMS
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Pervius $VERSION" \
            --notes-file notes.md \
            "pervius_${VERSION}_all.deb" SHA256SUMS
